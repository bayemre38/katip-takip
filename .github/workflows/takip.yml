name: Anadolu Adliyesi 7/24 Takip

on:
  workflow_dispatch:
    inputs:
      test_modu:
        description: 'Telefonuna canlı test bildirimi gönderilsin mi?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: katip-takip-botu
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyaları indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri yükle
        run: pip install requests beautifulsoup4

      - name: Adliye sitesini kontrol et
        env:
          NTFY_KANALI: ${{ secrets.NTFY_KANALI }}
          TEST_MODU: ${{ github.event.inputs.test_modu || 'false' }}
        run: python kontrol.py

      - name: Görülen duyuruları kaydet
        run: |
          git config user.name "Takip Botu"
          git config user.email "bot@users.noreply.github.com"
          git add -f gorulen_duyurular.json || true
          git diff --staged --quiet || (git commit -m "Duyuru listesi güncellendi" && git push)
